name: Check
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: funtime
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: funtime_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U funtime -d funtime_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      FUNTIME_TEST_DATABASE_URL: postgres://funtime:ci-only-password@127.0.0.1:5432/funtime_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - run: npm ci
      - run: npm run generate
      - name: Check generated contracts
        run: git diff --exit-code -- contracts/gen/go frontend/src/shared/api/generated
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Validate Compose and build containers
        run: docker compose -f deploy/compose.yaml -f deploy/compose.dev.yaml config --quiet && docker compose -f deploy/compose.yaml -f deploy/compose.dev.yaml build
